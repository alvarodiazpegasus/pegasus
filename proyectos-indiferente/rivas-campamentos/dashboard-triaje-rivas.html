<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Barlow,sans-serif;background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:48px 40px;max-width:480px;width:100%;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lock{font-size:48px;text-align:center;margin-bottom:20px}
h1{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;text-align:center;margin-bottom:8px;letter-spacing:.5px}
.subtitulo{text-align:center;color:#888;font-size:13px;margin-bottom:32px;line-height:1.5}
.warning{background:rgba(214,25,27,.12);border:1px solid rgba(214,25,27,.35);border-radius:8px;padding:14px 16px;margin-bottom:24px;font-size:12px;line-height:1.5;color:#ffd9d9}
.warning strong{color:#ff8a8a}
input{width:100%;padding:14px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;font-family:Barlow,sans-serif;font-size:15px;margin-bottom:16px;outline:none;transition:all .2s}
input:focus{border-color:#08B75B;background:rgba(255,255,255,.1)}
button{width:100%;padding:14px;background:#08B75B;color:#fff;border:none;border-radius:6px;font-family:Barlow,sans-serif;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:.5px;transition:all .2s}
button:hover{background:#0fd86c;transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error{color:#ff6b6b;font-size:13px;margin-top:12px;text-align:center;min-height:18px}
.loading{display:none;text-align:center;font-size:14px;color:#08B75B;margin-top:16px}
.footer{text-align:center;margin-top:24px;font-size:11px;color:#555}
</style>

function b64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

async function descifrar(e){
  e.preventDefault();
  const pwd = document.getElementById('pwd').value;
  const errEl = document.getElementById('err');
  const loadingEl = document.getElementById('loading');
  const btn = document.getElementById('btn');
  errEl.textContent='';
  btn.disabled=true;
  loadingEl.style.display='block';

  try {
    const data = b64ToBytes(BLOB);
    const salt = data.slice(0,16);
    const iv = data.slice(16,28);
    const ciphertext = data.slice(28);

    // PBKDF2
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:salt, iterations:600000, hash:'SHA-256'},
      keyMaterial,
      {name:'AES-GCM', length:256},
      false,
      ['decrypt']
    );

    // AES-GCM decrypt
    const plaintextBuf = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:iv},
      key,
      ciphertext
    );
    const html = new TextDecoder().decode(plaintextBuf);

    // Reemplazar todo el documento
    document.open();
    document.write(html);
    document.close();
  } catch(err){
    btn.disabled=false;
    loadingEl.style.display='none';
    errEl.textContent='Contraseña incorrecta';
    document.getElementById('pwd').value='';
    document.getElementById('pwd').focus();
  }
  return false;
}
